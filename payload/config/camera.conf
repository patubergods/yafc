# YAFC configuration. Read by the library in the camera's link path, live: the
# library looks at this file again every ~150 ms, so a hand edit applies without a
# reboot. The settings UI writes the same file.
#
# The library reads ONLY these keys: mode, view, reread, stats, bay_id, cam_src,
# cam_dst, bay_src, bay_dst, sen_dst, tail_dst. Every other key here exists for
# the on-screen settings page and is ignored by the library.
#
# To turn the mod OFF, do not rely on enabled: either write the kill-switch file
# /fs/rwdata/yafc/DISABLE (the library refuses and behaves as stock) or remove the
# library from its slot with the installer's remove step. See docs/RECOVERY.md.

# --- keys the library reads -------------------------------------------------
# "compose" places the camera band and shows the second view; "pass" leaves the
# picture alone; "diag" logs the buffer properties once and passes through.
mode=compose
# The view the library composes for. Only the combined views (rear360, front360)
# compose at all; anything else is handed back to the factory presentation.
view=rear360
# Let the library look at this file on every post; its own wall-clock gate keeps
# that to a few reads a second. 0 freezes the configuration after start-up.
reread=1
# 1 logs the post rate every ~10 s. Leave 0 for normal use.
stats=0
# 1 also sets an ID string on the second window. Off by default: an unknown name
# may confuse the window manager.
bay_id=0
# Where the camera picture comes from and where it goes. The source is the
# camera's own frame buffer; the destination is in screen pixels. These four
# rectangles are also what the view buttons rewrite.
cam_src=0,84,439,316
cam_dst=0,0,800,518
# The second view ("bay"): the region of the same buffer that holds the 360
# image, and where it is shown. A zero width or height hides it.
bay_src=447,0,273,480
bay_dst=0,522,456,718
# Sensor-panel and trailing-image rectangles. Only used where a build reads them;
# the on-screen panel is drawn by the HMI in this version.
sen_dst=
tail_dst=

# --- keys the settings page writes, ignored by the library ------------------
version=1
enabled=0
layout=stock
bay_360=450
bay_side=left
background=black
