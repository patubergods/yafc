# YAFC configuration. The library polls this file for settings; the popup sends
# transient view changes separately through /fs/tmpfs/yafc-view.
#
# The library reads these keys: mode, enabled, view, reread, stats, bay_id,
# cam_src, cam_dst, bay_src, bay_dst, sen_dst, tail_dst. Every other key here
# exists for the on-screen settings page or installer and is ignored by the library.
#
# To turn the mod OFF, set enabled=0 or write the kill-switch file
# /fs/rwdata/yafc/DISABLE, then restart the unit. For full removal use the
# installer's remove mode. See
# docs/RECOVERY.md.

# --- keys the library reads -------------------------------------------------
# "compose" places the camera band and shows the second view; "pass" leaves the
# picture alone; "diag" logs the buffer properties once and passes through.
mode=compose
# Startup view before a valid RAM mailbox record is available. Without a
# record, only rear360 and front360 use composition.
view=rear360
# Let the library look at this file on every post; its own wall-clock gate keeps
# that to a few reads a second. 0 freezes the configuration after start-up.
reread=1
# 1 logs the post rate every ~10 s. Leave 0 for normal use.
stats=0
# 1 also sets an ID string on the second window. Off by default: an unknown name
# may confuse the window manager.
bay_id=0
# Where the camera picture comes from and where it goes. The source is the
# camera's own frame buffer; the destination is in screen pixels. A valid
# mailbox record overrides these defaults while the camera runs.
cam_src=0,84,439,316
cam_dst=0,0,800,518
# The second view ("bay"): the region of the same buffer that holds the 360
# image, and where it is shown. A zero width or height hides it.
bay_src=447,0,273,480
bay_dst=0,522,456,718
# Sensor-panel and trailing-image rectangles. Only used where a build reads them;
# the on-screen panel is drawn by the HMI in this version.
sen_dst=
tail_dst=

# --- keys the settings page writes; enabled is read at start-up, the rest are ignored
version=1
enabled=1
layout=stock
bay_360=450
bay_side=left
background=black
# Read by the HMI fragments, not the library: black "Please wait..." dwell in ms.
cover_ms=700
